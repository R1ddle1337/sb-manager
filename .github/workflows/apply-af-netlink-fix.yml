name: Apply AF_NETLINK fix

on:
  push:
    branches: [fix/systemd-af-netlink]

permissions:
  contents: write

jobs:
  patch:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/systemd-af-netlink

      - name: Apply runtime and regression fixes
        run: python3 tools/apply-af-netlink-fix.py

      - name: Commit patched sources
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name "sb-manager automation"
          git config user.email "actions@users.noreply.github.com"
          git add setup.sh lib/runtime-security.sh lib/doctor.sh \
            tests/systemd-exec-smoke.sh tests/systemd-real-exec.sh \
            VERSION lib/common.sh README.md tests/install-smoke.sh CHANGELOG.md
          git diff --cached --check
          git commit -m "fix: allow systemd AF_NETLINK route monitoring"
          git push origin HEAD:fix/systemd-af-netlink
