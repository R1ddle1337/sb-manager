name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  syntax-and-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Install test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends jq openssl iproute2 shellcheck libcap2-bin

      - name: Bash syntax
        run: find . -type f -name '*.sh' -print0 | xargs -0 -n1 bash -n

      - name: ShellCheck
        run: shellcheck -x --severity=error sb setup.sh install.sh build-standalone.sh lib/*.sh protocols/*.sh tests/*.sh

      - name: Download tested sing-box core
        id: core
        shell: bash
        run: |
          set -Eeuo pipefail
          version=$(tr -d '[:space:]' < TESTED_CORE_VERSION)
          arch=amd64
          asset="sing-box-${version}-linux-${arch}.tar.gz"
          url="https://github.com/SagerNet/sing-box/releases/download/v${version}/${asset}"
          mkdir -p "$RUNNER_TEMP/sing-box"
          curl -fL --retry 3 "$url" -o "$RUNNER_TEMP/$asset"
          tar -xzf "$RUNNER_TEMP/$asset" -C "$RUNNER_TEMP/sing-box"
          binary=$(find "$RUNNER_TEMP/sing-box" -type f -name sing-box -perm -u+x -print -quit)
          test -n "$binary"
          echo "binary=$binary" >> "$GITHUB_OUTPUT"

      - name: Protocol and transaction tests
        env:
          SBM_TEST_SING_BOX: ${{ steps.core.outputs.binary }}
        run: bash tests/run.sh

      - name: Doctor completion regression
        env:
          SBM_TEST_SING_BOX: ${{ steps.core.outputs.binary }}
        run: bash tests/doctor-smoke.sh

      - name: systemd lifecycle test
        run: bash tests/service-lifecycle.sh

      - name: OpenRC lifecycle test
        run: bash tests/openrc-lifecycle.sh

      - name: First-download path regression
        run: bash tests/core-download-smoke.sh

      - name: Installer smoke test
        env:
          SBM_TEST_SING_BOX: ${{ steps.core.outputs.binary }}
        run: bash tests/install-smoke.sh

      - name: Build standalone installer
        run: |
          mkdir -p dist
          ./build-standalone.sh dist/sb-manager-install.sh
          bash -n dist/sb-manager-install.sh
          sha256sum dist/sb-manager-install.sh > dist/SHA256SUMS

      - name: Upload standalone installer
        uses: actions/upload-artifact@v4
        with:
          name: sb-manager-installer
          path: |
            dist/sb-manager-install.sh
            dist/SHA256SUMS

  debian-13-smoke:
    runs-on: ubuntu-latest
    container:
      image: debian:13-slim
    timeout-minutes: 15
    steps:
      - name: Install Debian 13 test dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends bash ca-certificates curl git jq openssl iproute2 util-linux procps tar gzip coreutils findutils passwd libcap2-bin

      - uses: actions/checkout@v4

      - name: Download tested sing-box core
        id: core
        shell: bash
        run: |
          set -Eeuo pipefail
          version=$(tr -d '[:space:]' < TESTED_CORE_VERSION)
          asset="sing-box-${version}-linux-amd64.tar.gz"
          curl -fL --retry 3 "https://github.com/SagerNet/sing-box/releases/download/v${version}/${asset}" -o "/tmp/${asset}"
          mkdir -p /tmp/sing-box
          tar -xzf "/tmp/${asset}" -C /tmp/sing-box
          binary=$(find /tmp/sing-box -type f -name sing-box -perm -u+x -print -quit)
          test -n "$binary"
          echo "binary=$binary" >> "$GITHUB_OUTPUT"

      - name: Debian 13 installer and doctor smoke
        env:
          SBM_TEST_SING_BOX: ${{ steps.core.outputs.binary }}
        run: |
          bash tests/install-smoke.sh
          bash tests/doctor-smoke.sh

  alpine-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        alpine: ['3.21', '3.22', '3.23', '3.24']
    steps:
      - uses: actions/checkout@v4

      - name: Alpine ${{ matrix.alpine }} OpenRC and musl smoke
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/src:ro" \
            alpine:${{ matrix.alpine }} \
            /bin/sh -ec '
              apk add --no-cache bash ca-certificates curl jq openssl iproute2 util-linux procps tar gzip coreutils findutils shadow openrc dcron libcap musl-utils gcompat
              mkdir -p /work
              cp -a /src/. /work/
              cd /work
              bash tests/alpine-smoke.sh
            '
