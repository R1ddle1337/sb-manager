name: Apply download retry fix

on:
  push:
    branches: [fix/download-retry-failfast]

permissions:
  contents: write

jobs:
  patch:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/download-retry-failfast

      - name: Apply download reliability fixes
        run: python3 tools/apply-download-retry-fix.py

      - name: Commit patched sources
        shell: bash
        run: |
          set -Eeuo pipefail
          chmod 0755 tests/download-retry-smoke.sh
          git config user.name "sb-manager automation"
          git config user.email "actions@users.noreply.github.com"
          git add lib/core.sh tests/download-retry-smoke.sh .github/workflows/ci.yml \
            VERSION lib/common.sh tests/install-smoke.sh README.md CHANGELOG.md
          git diff --cached --check
          git commit -m "fix: retry downloads and fail fast on partial assets"
          git push origin HEAD:fix/download-retry-failfast
